server:
  port: 8085

spring:
  application:
    name: smart-community-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3308/smart_community?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6378
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Jackson日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartcommunity.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT配置
jwt:
  secret: smart-community-v2-secret-key-2024-jwt-token-must-be-long-enough
  expire: 86400000  # 24小时
  header: Authorization
  token-prefix: Bearer

# Knife4j文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# MinIO文件存储配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: smart-community

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-chengdu.aliyuncs.com
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    buckets:
      default:
        bucket-name: smart-community-v1
      face:
        bucket-name: smart-community-v3
        access-key-id: ${ALIYUN_FACE_ACCESS_KEY_ID:your-face-access-key-id}
        access-key-secret: ${ALIYUN_FACE_ACCESS_KEY_SECRET:your-face-access-key-secret}
# 百度AI及地图配置
baidu:
  ai:
    app-id: 7899904
    api-key: ${BAIDU_AI_API_KEY:your-baidu-api-key}
    secret-key: ${BAIDU_AI_SECRET_KEY:your-baidu-secret-key}
    group-id: smart_community
  map:
    ak: your-baidu-map-ak

# 腾讯AI人脸识别配置（需替换为实际密钥）
tencent:
  ai:
    secret-id: your-secret-id
    secret-key: your-secret-key
    face-set-id: smart-community-face-set
    region: ap-guangzhou

# 高德地图配置（前端 index.html 中使用）
amap:
  key: 65146e35e3f8c076f2857ae5454a2d81
  js-api-url: https://webapi.amap.com/maps?v=2.0

# 日志
logging:
  charset:
    console: UTF-8
  level:
    com.smartcommunity: debug
